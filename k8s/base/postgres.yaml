apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: secureboard
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: secureboard
spec:
  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: secureboard

  annotations:
    checkov.io/skip1: >-
      CKV_K8S_40=The official postgres:17-alpine image uses the dedicated
      postgres runtime account UID/GID 70. The container is explicitly forced
      to run as that non-root vendor account.

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70

        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          imagePullPolicy: Always

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_USER_FILE
              value: /run/secrets/postgres/POSTGRES_USER

            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/POSTGRES_PASSWORD

            - name: POSTGRES_DB_FILE
              value: /run/secrets/postgres/POSTGRES_DB

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pg_isready
                  -U "$(cat /run/secrets/postgres/POSTGRES_USER)"
                  -d "$(cat /run/secrets/postgres/POSTGRES_DB)"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pg_isready
                  -U "$(cat /run/secrets/postgres/POSTGRES_USER)"
                  -d "$(cat /run/secrets/postgres/POSTGRES_DB)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-runtime
              mountPath: /var/run/postgresql

            - name: tmp
              mountPath: /tmp

            - name: postgres-secrets
              mountPath: /run/secrets/postgres
              readOnly: true

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

        - name: postgres-runtime
          emptyDir: {}

        - name: tmp
          emptyDir: {}

        - name: postgres-secrets
          secret:
            secretName: secureboard-secrets
            defaultMode: 0440

            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER

              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD

              - key: POSTGRES_DB
                path: POSTGRES_DB
