name: SecureBoard CD

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful SecureBoard CI run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: secureboard-kind-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy authorized release to kind
    runs-on:
      - self-hosted
      - linux
      - x64
      - secureboard-kind

    timeout-minutes: 20

    steps:
      - name: Validate requested release ID
        env:
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$RELEASE_RUN_ID" \
            | grep -Eq '^[0-9]+$'; then
            echo "Deployment denied: run_id must be numeric"
            exit 1
          fi

          echo "Requested CI run: $RELEASE_RUN_ID"

      - name: Checkout trusted deployment code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Execute verified release deployer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          ./scripts/deploy-kind-release.sh \
            "$RELEASE_RUN_ID"
