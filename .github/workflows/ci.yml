name: SecureBoard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: secureboard
          POSTGRES_PASSWORD: secureboard_ci_password
          POSTGRES_DB: secureboard_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secureboard -d secureboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: secureboard-ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test
      TEST_DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
