name: SecureBoard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: secureboard
          POSTGRES_PASSWORD: secureboard_ci_password
          POSTGRES_DB: secureboard_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secureboard -d secureboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: secureboard-ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test
      TEST_DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v


  sast:
    name: Semgrep SAST scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --error \
            /src

  
  secrets:
    name: Gitleaks secret scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --redact


  sca:
    name: Trivy dependency scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy vulnerability scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/aquasecurity/trivy:0.74.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .


  container_security:
    name: Trivy container image scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build SecureBoard image
        run: |
          docker build \
            --pull \
            -t secureboard-api:ci \
            .

      - name: Scan container image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.74.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            secureboard-api:ci


  iac:
    name: Checkov IaC scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Checkov
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            bridgecrew/checkov:3.3.17 \
            -d /repo/infra \
            --framework terraform \
            --compact


  dast:
    name: OWASP ZAP active DAST scan

    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: secureboard
      POSTGRES_PASSWORD: secureboard_dast_ci_password
      POSTGRES_DB: secureboard
      JWT_SECRET: secureboard-dast-ci-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Start SecureBoard
        run: |
          docker compose up -d --build

      - name: Apply database migrations
        run: |
          docker compose exec -T api alembic upgrade head

      - name: Wait for SecureBoard API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "SecureBoard API is ready"
              exit 0
            fi

            echo "Waiting for SecureBoard API..."
            sleep 2
          done

          echo "SecureBoard API did not become ready"
          docker compose logs
          exit 1

      - name: Pull pinned OWASP ZAP image
        run: |
          docker pull "$ZAP_IMAGE"

      - name: Run OWASP ZAP active API scan
        run: |
          NETWORK=$(docker inspect secureboard-api \
            --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}')

          echo "Using Docker network: $NETWORK"

          docker run --rm \
            --network "$NETWORK" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
            -t http://api:8000/openapi.json \
            -f openapi \
            -s

      - name: Show application logs on failure
        if: failure()
        run: |
          docker compose logs api

      - name: Stop DAST environment
        if: always()
        run: |
          docker compose down -v