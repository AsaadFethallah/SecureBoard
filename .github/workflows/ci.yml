name: SecureBoard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: secureboard
          POSTGRES_PASSWORD: secureboard_ci_password
          POSTGRES_DB: secureboard_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secureboard -d secureboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: secureboard-ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test
      TEST_DATABASE_URL: postgresql+psycopg://secureboard:secureboard_ci_password@localhost:5432/secureboard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v


  sast:
    name: Semgrep SAST scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --error \
            /src

  
  secrets:
    name: Gitleaks secret scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --redact


  sca:
    name: Trivy dependency scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy vulnerability scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/aquasecurity/trivy:0.74.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .


  build_image:
    name: Build canonical SecureBoard image

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build SecureBoard image
        run: |
          docker build \
            --pull \
            -t secureboard-api:ci \
            .

      - name: Record image identity
        run: |
          docker image inspect \
            secureboard-api:ci \
            --format '{{.Id}}' \
            > image-id.txt

          echo "Canonical image ID:"
          cat image-id.txt

      - name: Export canonical image
        run: |
          docker save \
            secureboard-api:ci \
            -o secureboard-api.tar

          sha256sum secureboard-api.tar \
            > secureboard-api.tar.sha256

          sha256sum -c secureboard-api.tar.sha256

      - name: Upload canonical image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secureboard-container-image
          path: |
            secureboard-api.tar
            secureboard-api.tar.sha256
            image-id.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


  container_security:
    name: Trivy container image scan

    runs-on: ubuntu-latest

    needs:
      - build_image

    steps:
      - name: Download canonical image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: secureboard-container-image
          path: .

      - name: Verify image artifact integrity
        run: |
          sha256sum -c secureboard-api.tar.sha256

      - name: Scan canonical container image
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/aquasecurity/trivy:0.74.0 \
            image \
            --input /work/secureboard-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress


  iac:
    name: Checkov IaC scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Checkov
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            bridgecrew/checkov:3.3.17 \
            -d /repo/infra \
            --framework terraform \
            --compact


  dast:
    name: OWASP ZAP active DAST scan

    runs-on: ubuntu-latest

    needs:
      - build_image

    env:
      POSTGRES_USER: secureboard
      POSTGRES_PASSWORD: secureboard_dast_ci_password
      POSTGRES_DB: secureboard

      JWT_SECRET: secureboard-dast-ci-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      SECUREBOARD_IMAGE: secureboard-api:ci

      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download canonical SecureBoard image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: secureboard-container-image
          path: .

      - name: Verify canonical image artifact integrity
        run: |
          sha256sum -c secureboard-api.tar.sha256

      - name: Load canonical SecureBoard image
        run: |
          docker load \
            -i secureboard-api.tar

      - name: Verify canonical image identity
        run: |
          EXPECTED_IMAGE_ID=$(cat image-id.txt)

          ACTUAL_IMAGE_ID=$(docker image inspect \
            secureboard-api:ci \
            --format '{{.Id}}')

          echo "Expected image ID: $EXPECTED_IMAGE_ID"
          echo "Actual image ID:   $ACTUAL_IMAGE_ID"

          if [ "$EXPECTED_IMAGE_ID" != "$ACTUAL_IMAGE_ID" ]; then
            echo "Canonical image identity verification failed"
            exit 1
          fi

          echo "Canonical image identity verified"

      - name: Start SecureBoard from canonical image
        run: |
          docker compose up -d --no-build

      - name: Apply database migrations
        run: |
          docker compose exec -T api alembic upgrade head

      - name: Wait for SecureBoard API
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:8000/health \
              > /dev/null; then

              echo "SecureBoard API is ready"
              exit 0
            fi

            echo "Waiting for SecureBoard API..."
            sleep 2
          done

          echo "SecureBoard API did not become ready"
          docker compose logs
          exit 1

      - name: Pull pinned OWASP ZAP image
        run: |
          docker pull "$ZAP_IMAGE"

      - name: Run OWASP ZAP active API scan
        run: |
          NETWORK=$(docker inspect secureboard-api \
            --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}')

          echo "Using Docker network: $NETWORK"

          docker run --rm \
            --network "$NETWORK" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
            -t http://api:8000/openapi.json \
            -f openapi \
            -s

      - name: Show application logs on failure
        if: failure()
        run: |
          docker compose logs api

      - name: Stop DAST environment
        if: always()
        run: |
          docker compose down -v


  sbom:
    name: Generate CycloneDX SBOM

    runs-on: ubuntu-latest

    needs:
      - build_image

    env:
      SYFT_IMAGE: anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c

    steps:
      - name: Download canonical image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: secureboard-container-image
          path: .

      - name: Verify image artifact integrity
        run: |
          sha256sum -c secureboard-api.tar.sha256

      - name: Pull pinned Syft image
        run: |
          docker pull "$SYFT_IMAGE"

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom-output

          docker run --rm \
            -v "$PWD/secureboard-api.tar:/work/secureboard-api.tar:ro" \
            -v "$PWD/sbom-output:/output" \
            "$SYFT_IMAGE" \
            docker-archive:/work/secureboard-api.tar \
            -o cyclonedx-json=/output/sbom.cdx.json

      - name: Validate SBOM
        run: |
          test -f sbom-output/sbom.cdx.json

          test "$(jq -r '.bomFormat' sbom-output/sbom.cdx.json)" = "CycloneDX"

          COMPONENTS=$(jq '.components | length' sbom-output/sbom.cdx.json)

          echo "SBOM components: $COMPONENTS"

          if [ "$COMPONENTS" -le 0 ]; then
            echo "SBOM contains no components"
            exit 1
          fi

          echo "CycloneDX SBOM validated successfully"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secureboard-sbom-cyclonedx
          path: sbom-output/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30


  sign_artifact:
    name: Cosign keyless artifact signing

    runs-on: ubuntu-latest

    needs:
      - build_image
      - test
      - sast
      - secrets
      - sca
      - container_security
      - iac
      - dast
      - sbom

    permissions:
      contents: read
      id-token: write

    env:
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b

    steps:
      - name: Download canonical SecureBoard image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: secureboard-container-image
          path: .

      - name: Verify canonical artifact integrity
        run: |
          sha256sum -c secureboard-api.tar.sha256

      - name: Pull pinned Cosign image
        run: |
          docker pull "$COSIGN_IMAGE"

      - name: Sign canonical artifact with GitHub OIDC
        run: |
          mkdir -p cosign-output

          touch cosign-output/secureboard-api.tar.sigstore.json
          chmod 666 cosign-output/secureboard-api.tar.sigstore.json

          docker run --rm \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "$PWD/secureboard-api.tar:/work/secureboard-api.tar:ro" \
            -v "$PWD/cosign-output/secureboard-api.tar.sigstore.json:/output/secureboard-api.tar.sigstore.json" \
            "$COSIGN_IMAGE" \
            sign-blob \
            --yes \
            --bundle /output/secureboard-api.tar.sigstore.json \
            /work/secureboard-api.tar

      - name: Verify Cosign signature
        run: |
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"

          echo "Expected signing identity:"
          echo "$CERTIFICATE_IDENTITY"

          docker run --rm \
            -v "$PWD/secureboard-api.tar:/work/secureboard-api.tar:ro" \
            -v "$PWD/cosign-output:/output:ro" \
            "$COSIGN_IMAGE" \
            verify-blob \
            /work/secureboard-api.tar \
            --bundle /output/secureboard-api.tar.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload Sigstore signature bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secureboard-cosign-signature
          path: cosign-output/secureboard-api.tar.sigstore.json
          if-no-files-found: error
          retention-days: 30


  provenance:
    name: Verify build provenance

    runs-on: ubuntu-latest

    needs:
      - build_image

    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download canonical SecureBoard image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: secureboard-container-image
          path: .

      - name: Verify canonical artifact integrity
        run: |
          sha256sum -c secureboard-api.tar.sha256

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: secureboard-api.tar

      - name: Verify build provenance attestation
        run: |
          gh attestation verify \
            secureboard-api.tar \
            --repo "$GITHUB_REPOSITORY"